<!DOCTYPE html>
<html lang="id">

<head>
 <meta charset="UTF-8">

<meta
name="theme-color"
content="#2E7D32">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">
    <title>Audit Parser V4</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/audit.css">

</head>

<body>

   <!-- ===================================== -->
<!-- HEADER -->
<!-- ===================================== -->

<header class="audit-header">

    <div class="header-left">

        <h1>Audit Parser V4</h1>

        <p>
            Dashboard Validasi Parser Monitoring RKAKL
        </p>

    </div>

    <div class="header-right">

        <table>

            <tr>

                <td>Tanggal</td>

                <td id="auditTanggal"></td>

            </tr>

            <tr>

                <td>Jam</td>

                <td id="auditJam"></td>

            </tr>

            <tr>

                <td>Status</td>

                <td>

                    <span id="auditStatus">

                        Ready

                    </span>

                </td>

            </tr>

        </table>

    </div>

</header>
  <main class="audit-container">

   <!-- ===================================== -->
<!-- SUMMARY -->
<!-- ===================================== -->

<section class="audit-section">

    <div class="section-title">

        📊 Ringkasan Audit

    </div>

    <div id="summary">

    </div>

</section>

   <!-- ===================================== -->
<!-- CHART -->
<!-- ===================================== -->

<section class="audit-section">

    <div class="section-title">

        📈 Statistik Audit

    </div>

    <div id="chartArea">

    </div>

</section>

   <!-- ===================================== -->
<!-- FILTER -->
<!-- ===================================== -->

<section class="audit-section">

    <div class="section-title">

        🔍 Filter Audit

    </div>

    <div id="filterArea">

    </div>

</section>
   <!-- ===================================== -->
<!-- TABLE -->
<!-- ===================================== -->

<section class="audit-section">

    <div class="section-title">

        📋 Hasil Audit

    </div>

    <div id="auditTable">

    </div>

</section>
   <!-- ===================================== -->
<!-- DETAIL MODAL -->
<!-- ===================================== -->

<div id="detailModal"
     class="audit-modal"
     style="display:none;">

    <div class="audit-modal-content">

        <div class="audit-modal-header">

            <h2>Detail Audit</h2>

            <button
                id="btnCloseModal"
                onclick="tutupModal()">

                ✕

            </button>

        </div>

        <div
            id="detailContent">

        </div>

    </div>

</div>

  <!-- ===================================== -->
<!-- LOADING -->
<!-- ===================================== -->

<div id="loading"
     class="loading-overlay"
     style="display:none;">

    <div class="loading-box">

        <h2>

            Audit Parser V4

        </h2>

        <p>

            Memproses Data...

        </p>

        <p>

            Mohon Tunggu...

        </p>

        <div class="loading-spinner">

            ⏳

        </div>

    </div>

</div>
    </main>
  <footer class="audit-footer">

    <hr>

    <p>

        Audit Parser V4

        <br>

        Balai Pengelolaan Hutan Lestari Wilayah XI Banjarbaru

    </p>

</footer>

    <!-- ===================================== -->
    <!-- JAVASCRIPT -->
    <!-- ===================================== -->

    <script src="js/parser.js"></script>

    <script src="js/audit-trace.js"></script>

    <script src="js/validator.js"></script>

    <script src="js/audit-parser.js"></script>

    <script src="js/audit-ui.js"></script>
  <script>

function updateJam(){

    const sekarang=new Date();

    document.getElementById("auditTanggal").innerHTML=

        sekarang.toLocaleDateString("id-ID");

    document.getElementById("auditJam").innerHTML=

        sekarang.toLocaleTimeString("id-ID");

}

updateJam();

setInterval(updateJam,1000);

</script>
<script>

function bukaModal(html){

    const modal =
        document.getElementById("detailModal");

    document.getElementById("detailContent").innerHTML =
        html;

    modal.style.display = "block";

}

function tutupModal(){

    document.getElementById("detailModal").style.display =
        "none";

}

window.onclick = function(e){

    const modal =
        document.getElementById("detailModal");

    if(e.target === modal){

        tutupModal();

    }

};

</script>
  <script>

function showLoading(){

    document
        .getElementById("loading")
        .style
        .display="flex";

}

function hideLoading(){

    document
        .getElementById("loading")
        .style
        .display="none";

}

</script>

</body>

</html>
