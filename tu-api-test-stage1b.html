<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TU API TEST — Stage 1B</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#202938;margin:0}.wrap{max-width:1000px;margin:36px auto;padding:20px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:14px;padding:24px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}button{padding:12px;border:0;border-radius:9px;background:#3158a6;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5}pre{background:#111827;color:#e5e7eb;padding:16px;border-radius:10px;min-height:220px;white-space:pre-wrap;overflow:auto}.status{display:inline-block;padding:6px 10px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:700}.note{background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:9px;margin-top:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>TU API TEST — Stage 1B</h1>
<p>Read-only endpoint testing · Deployment: <b>/dev</b> · Tahun: <b>2026</b></p>
<div id="tuLoginPanel"><div id="googleSignInButton"></div><div id="tuLoginLoading"></div><div id="tuAuthMessage"></div></div>
<div id="tuAppPanel" style="display:none">
<p>Status Login: <span id="tuLoginStatus" class="status">Operator</span></p>
<div id="tuUserBox"><b id="tuUserName"></b><br><span id="tuUserEmail"></span></div>
<div class="grid" style="margin-top:16px">
<button data-action="tu_bootstrap">Test tu_bootstrap</button>
<button data-action="tu_realisasi_list">Test tu_realisasi_list</button>
<button data-action="tu_rpd_list">Test tu_rpd_list</button>
<button data-action="tu_revisi_list">Test tu_revisi_list</button>
<button data-action="tu_monitoring">Test tu_monitoring</button>
</div>
<div class="note">Hanya endpoint read-only. Tidak ada save, update, delete, atau revisi.</div>
</div>
</div>
<div class="card"><h2>Hasil</h2><pre id="tuTestOutput">Belum ada pengujian.</pre></div>
</div>
<script src="assets/js/tu-config.js"></script>
<script src="assets/js/tu-api.js"></script>
<script src="assets/js/tu-auth.js"></script>
<script>
(function(){
const out=document.getElementById("tuTestOutput"),login=document.getElementById("tuLoginPanel"),app=document.getElementById("tuAppPanel");
function logged(user){login.style.display="none";app.style.display="";document.getElementById("tuUserName").textContent=user?.name||"";document.getElementById("tuUserEmail").textContent=user?.email||""}
window.tuShowLogin=function(){login.style.display="";app.style.display="none"};
window.tuShowMessage=function(m){document.getElementById("tuAuthMessage").textContent=m||""};
window.tuHandleBootstrap=function(r){if(r?.user)logged(r.user)};
window.tuInitData=function(r){if(r?.user)logged(r.user)};
document.querySelectorAll("[data-action]").forEach(function(b){b.addEventListener("click",async function(){const action=b.dataset.action;b.disabled=true;out.textContent="Menjalankan "+action+"...";try{const r=await tuApiRequest(action,{tahun:TU_CONFIG.TAHUN_DEFAULT});out.textContent=action+"\n\n"+JSON.stringify(r,null,2)}catch(e){out.textContent=action+"\n\n"+JSON.stringify({ok:false,error:e?.message||String(e)},null,2)}finally{b.disabled=false}})});
})();
</script>
</body>
</html>
